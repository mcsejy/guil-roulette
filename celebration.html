<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행운을 잡았어요</title>
<style>
:root {
  --accent: #a11212;
  --teal: #2f6f6b;
  --paper-bg: #f7f4ec;
  --gold: #FFD700;
  --pink: #FFB6D9;
  --yellow: #FFE5A1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: var(--paper-bg);
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.celebration-card {
  max-width: 500px;
  background: white;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 10px 40px rgba(161, 18, 18, 0.15);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.celebration-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
  background-size: 20px 20px;
  animation: float 20s linear infinite;
}

@keyframes float {
  0% { transform: translate(0, 0); }
  100% { transform: translate(20px, 20px); }
}

.content {
  position: relative;
  z-index: 1;
}

.illustration {
  width: 100%;
  max-width: 400px;
  height: auto;
  margin: 0 auto 20px;
}

.celebration-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 32px;
  font-weight: 900;
  color: var(--accent);
  margin: 0 0 10px;
  letter-spacing: 0.05em;
}

.celebration-subtitle {
  font-size: 16px;
  color: #666;
  margin: 0 0 15px;
  line-height: 1.6;
}

.celebration-text {
  font-size: 14px;
  color: var(--teal);
  margin: 15px 0;
  line-height: 1.8;
  font-weight: 500;
}

.emoji-celebration {
  font-size: 48px;
  margin: 20px 0;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.decorations {
  position: absolute;
  font-size: 24px;
  animation: float-decoration 3s ease-in-out infinite;
}

.deco1 { top: 20px; left: 20px; animation-delay: 0s; }
.deco2 { top: 30px; right: 30px; animation-delay: 0.5s; }
.deco3 { bottom: 30px; left: 30px; animation-delay: 1s; }
.deco4 { bottom: 40px; right: 20px; animation-delay: 1.5s; }

@keyframes float-decoration {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(10deg); }
}

.share-prompt {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 182, 217, 0.1));
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 15px;
  margin-top: 20px;
  font-size: 13px;
  color: #555;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="celebration-card">
  <div class="decorations deco1">🎁</div>
  <div class="decorations deco2">✨</div>
  <div class="decorations deco3">🎉</div>
  <div class="decorations deco4">⭐</div>

  <div class="content">
    <svg class="illustration" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
      <!-- 배경 -->
      <defs>
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#E8F4F8;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#FFE5E5;stop-opacity:1" />
        </linearGradient>

        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
        </filter>
      </defs>

      <rect width="400" height="380" fill="url(#skyGradient)"/>

      <!-- 선물 바구니 (왼쪽) -->
      <g transform="translate(60, 240)" filter="url(#shadow)">
        <!-- 바구니 본체 -->
        <path d="M 20 10 L 40 5 L 55 10 L 55 40 Q 55 50 45 55 L 30 55 Q 20 50 20 40 Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
        <!-- 바구니 손잡이 -->
        <path d="M 30 55 Q 37.5 35 45 55" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
        <!-- 선물 -->
        <rect x="30" y="20" width="18" height="18" fill="#FFB6D9" stroke="#FF69B4" stroke-width="1.5" rx="2"/>
        <line x1="39" y1="20" x2="39" y2="38" stroke="#FFE5E5" stroke-width="2"/>
        <line x1="30" y1="29" x2="48" y2="29" stroke="#FFE5E5" stroke-width="2"/>
      </g>

      <!-- 선물 상자들 (오른쪽) -->
      <g transform="translate(280, 260)" filter="url(#shadow)">
        <!-- 큰 선물 상자 -->
        <rect x="0" y="0" width="40" height="35" fill="#FFE5A1" stroke="#FFD700" stroke-width="2" rx="3"/>
        <line x1="0" y1="18" x2="40" y2="18" stroke="#FFD700" stroke-width="2"/>
        <line x1="20" y1="0" x2="20" y2="35" stroke="#FFD700" stroke-width="2"/>
        <!-- 리본 -->
        <circle cx="20" cy="18" r="5" fill="#FF69B4" stroke="#FF1493" stroke-width="1"/>
      </g>

      <!-- 작은 선물 상자 (오른쪽 아래) -->
      <g transform="translate(310, 300)" filter="url(#shadow)">
        <rect x="0" y="0" width="28" height="25" fill="#a11212" stroke="#8B0000" stroke-width="2" rx="2"/>
        <line x1="0" y1="12" x2="28" y2="12" stroke="#FFE5A1" stroke-width="1.5"/>
        <line x1="14" y1="0" x2="14" y2="25" stroke="#FFE5A1" stroke-width="1.5"/>
        <!-- 리본 -->
        <circle cx="14" cy="12" r="3.5" fill="#FFE5A1"/>
      </g>

      <!-- 중앙 캐릭터 -->
      <g transform="translate(200, 140)" filter="url(#shadow)">
        <!-- 몸 -->
        <circle cx="0" cy="30" r="28" fill="#FFE5A1" stroke="#a11212" stroke-width="2.5"/>

        <!-- 머리 -->
        <circle cx="0" cy="-8" r="32" fill="#FFCC99" stroke="#a11212" stroke-width="2.5"/>

        <!-- 귀 -->
        <circle cx="-20" cy="-22" r="8" fill="#FFCC99" stroke="#a11212" stroke-width="1.5"/>
        <circle cx="20" cy="-22" r="8" fill="#FFCC99" stroke="#a11212" stroke-width="1.5"/>
        <circle cx="-20" cy="-22" r="4" fill="#FFB6D9"/>
        <circle cx="20" cy="-22" r="4" fill="#FFB6D9"/>

        <!-- 눈 -->
        <circle cx="-12" cy="-15" r="5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="12" cy="-15" r="5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-11" cy="-14" r="3" fill="#1a1a1a"/>
        <circle cx="13" cy="-14" r="3" fill="#1a1a1a"/>

        <!-- 눈 반짝임 -->
        <circle cx="-10" cy="-16" r="1.5" fill="white"/>
        <circle cx="14" cy="-16" r="1.5" fill="white"/>

        <!-- 입 (웃는 모습) -->
        <path d="M -8 -2 Q 0 4 8 -2" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 양볼 -->
        <circle cx="-22" cy="-5" r="6" fill="#FFB6D9" opacity="0.6"/>
        <circle cx="22" cy="-5" r="6" fill="#FFB6D9" opacity="0.6"/>

        <!-- 왼쪽 팔 (위로) -->
        <g>
          <rect x="-38" y="-15" width="12" height="50" fill="#FFCC99" stroke="#a11212" stroke-width="2" rx="6" transform="rotate(-35 -32 15)"/>
          <!-- 손 -->
          <circle cx="-50" cy="-25" r="10" fill="#FFCC99" stroke="#a11212" stroke-width="2"/>
          <circle cx="-50" cy="-25" r="6" fill="#FFD700"/>
        </g>

        <!-- 오른쪽 팔 (위로) -->
        <g>
          <rect x="26" y="-15" width="12" height="50" fill="#FFCC99" stroke="#a11212" stroke-width="2" rx="6" transform="rotate(35 32 15)"/>
          <!-- 손 -->
          <circle cx="50" cy="-25" r="10" fill="#FFCC99" stroke="#a11212" stroke-width="2"/>
          <circle cx="50" cy="-25" r="6" fill="#FFD700"/>
        </g>

        <!-- 왼쪽 다리 -->
        <rect x="-16" y="52" width="10" height="20" fill="#FFCC99" stroke="#a11212" stroke-width="2" rx="5"/>
        <!-- 왼쪽 신발 -->
        <ellipse cx="-11" cy="75" rx="9" ry="6" fill="#a11212"/>

        <!-- 오른쪽 다리 -->
        <rect x="6" y="52" width="10" height="20" fill="#FFCC99" stroke="#a11212" stroke-width="2" rx="5"/>
        <!-- 오른쪽 신발 -->
        <ellipse cx="11" cy="75" rx="9" ry="6" fill="#a11212"/>
      </g>

      <!-- 떠다니는 별들 -->
      <g opacity="0.8">
        <path d="M 80 60 L 84 70 L 95 70 L 86 77 L 90 87 L 80 80 L 70 87 L 74 77 L 65 70 L 76 70 Z" fill="#FFD700"/>
        <path d="M 320 90 L 323 98 L 332 98 L 325 103 L 328 111 L 320 106 L 312 111 L 315 103 L 308 98 L 317 98 Z" fill="#FF69B4"/>
        <path d="M 100 280 L 103 287 L 112 287 L 105 292 L 108 300 L 100 295 L 92 300 L 95 292 L 88 287 L 97 287 Z" fill="#FFD700"/>
      </g>

      <!-- 하트 모양들 -->
      <g opacity="0.9">
        <path d="M 280 120 C 285 110, 295 110, 295 120 C 295 130, 280 140, 280 140 C 280 140, 265 130, 265 120 C 265 110, 275 110, 280 120 Z" fill="#FF69B4"/>
        <path d="M 340 200 C 343 194, 350 194, 350 200 C 350 206, 340 212, 340 212 C 340 212, 330 206, 330 200 C 330 194, 337 194, 340 200 Z" fill="#FFB6D9"/>
      </g>
    </svg>

    <div class="emoji-celebration">🎉✨🎁</div>

    <h1 class="celebration-title">축하합니다!</h1>
    <p class="celebration-subtitle">행운을 잡았어요!</p>

    <div class="celebration-text">
      당신의 행운의 순간을 친구들과 함께 나눠보세요!
    </div>

    <div class="share-prompt">
      <strong>💌 카카오톡으로 주소를 공유해주세요</strong><br>
      친구들에게 이 행운을 나눠주고 함께 즐거워해요!
    </div>

    <button id="downloadBtn" style="
      background: #2f6f6b;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 600;
    ">축하 이미지 다운로드</button>
  </div>
</div>

<canvas id="downloadCanvas" style="display: none;"></canvas>

<script>
document.getElementById('downloadBtn').addEventListener('click', function() {
  const canvas = document.getElementById('downloadCanvas');
  canvas.width = 800;
  canvas.height = 760;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 0, 760);
  gradient.addColorStop(0, '#E8F4F8');
  gradient.addColorStop(1, '#FFE5E5');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 800, 760);

  ctx.fillStyle = 'white';
  ctx.shadowColor = 'rgba(0,0,0,0.15)';
  ctx.shadowBlur = 40;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 10;
  ctx.beginPath();
  ctx.roundRect(100, 80, 600, 600, 20);
  ctx.fill();

  const centerX = 400;
  const centerY = 300;

  ctx.fillStyle = '#FFE5A1';
  ctx.strokeStyle = '#a11212';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(centerX, centerY + 60, 56, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#FFCC99';
  ctx.beginPath();
  ctx.arc(centerX, centerY - 16, 64, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(centerX - 24, centerY - 30, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX + 24, centerY - 30, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(centerX - 22, centerY - 28, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(centerX + 26, centerY - 28, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.quadraticCurveTo(centerX, centerY, centerX + 16, centerY - 4);
  ctx.stroke();

  ctx.strokeStyle = '#a11212';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';

  ctx.fillStyle = '#FFCC99';
  ctx.beginPath();
  ctx.moveTo(centerX - 50, centerY + 20);
  ctx.quadraticCurveTo(centerX - 80, centerY - 40, centerX - 100, centerY - 50);
  ctx.lineTo(centerX - 95, centerY - 45);
  ctx.quadraticCurveTo(centerX - 75, centerY - 35, centerX - 50, centerY + 25);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(centerX + 50, centerY + 20);
  ctx.quadraticCurveTo(centerX + 80, centerY - 40, centerX + 100, centerY - 50);
  ctx.lineTo(centerX + 95, centerY - 45);
  ctx.quadraticCurveTo(centerX + 75, centerY - 35, centerX + 50, centerY + 25);
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.strokeStyle = '#a11212';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(centerX - 100, centerY - 50, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(centerX + 100, centerY - 50, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(centerX - 100, centerY - 50, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(centerX + 100, centerY - 50, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFCC99';
  ctx.beginPath();
  ctx.fillRect(centerX - 20, centerY + 110, 16, 40);
  ctx.stroke();
  ctx.beginPath();
  ctx.fillRect(centerX + 8, centerY + 110, 16, 40);
  ctx.stroke();

  ctx.fillStyle = '#a11212';
  ctx.beginPath();
  ctx.ellipse(centerX - 12, centerY + 155, 18, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(centerX + 16, centerY + 155, 18, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#D2691E';
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(150, 420);
  ctx.lineTo(180, 410);
  ctx.lineTo(210, 420);
  ctx.lineTo(210, 460);
  ctx.quadraticCurveTo(210, 475, 195, 485);
  ctx.lineTo(160, 485);
  ctx.quadraticCurveTo(145, 475, 145, 460);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.quadraticCurveTo(172.5, 450, 180, 485);
  ctx.stroke();

  ctx.fillStyle = '#FFE5A1';
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 2;
  ctx.fillRect(550, 430, 80, 70);
  ctx.strokeRect(550, 430, 80, 70);

  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(550, 465);
  ctx.lineTo(630, 465);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(590, 430);
  ctx.lineTo(590, 500);
  ctx.stroke();

  ctx.fillStyle = '#a11212';
  ctx.fillRect(620, 480, 56, 50);
  ctx.strokeStyle = '#8B0000';
  ctx.lineWidth = 2;
  ctx.strokeRect(620, 480, 56, 50);

  ctx.fillStyle = '#a11212';
  ctx.font = 'bold 60px "Noto Serif KR", serif';
  ctx.textAlign = 'center';
  ctx.fillText('축하합니다!', 400, 600);

  ctx.font = '32px "Noto Sans KR", sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('행운을 잡았어요!', 400, 650);

  canvas.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'guil-roulette-celebration.png';
    link.click();
    URL.revokeObjectURL(url);
  });
});
</script>

</body>
</html>
